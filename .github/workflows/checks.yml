name: checks

# The full scripts/check-*.mjs suite — the same guards .githooks/pre-commit
# runs locally, but unconditionally, so nothing lands on main unchecked and
# js-engine parity can never silently skip (the sibling is always cloned).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Checkout nanoodle-js (js-engine parity sibling)
        uses: actions/checkout@v4
        with:
          repository: nanoodlecom/nanoodle-js
          path: nanoodle-js-sibling

      - name: Checkout nanoodle-py (llms-full.txt source)
        uses: actions/checkout@v4
        with:
          repository: nanoodlecom/nanoodle-py
          path: nanoodle-py-sibling

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run check suite
        env:
          NANOODLE_JS: ${{ github.workspace }}/nanoodle-js-sibling
        run: |
          fails=0
          for f in scripts/check-*.mjs; do
            echo "::group::$f"
            if ! node "$f"; then
              fails=$((fails+1))
              echo "::error file=$f::check failed"
            fi
            echo "::endgroup::"
          done
          # parity must have actually run, not skipped
          if node scripts/check-js-parity.mjs | grep -q '^⊘ skip'; then
            echo "::error::js-engine parity skipped — sibling checkout missing"
            fails=$((fails+1))
          fi
          exit $fails

      # Named step so a forgotten gen-changelog is a first-class GitHub check,
      # not a line buried in the scripts/check-*.mjs loop (PRs #430, #433).
      # The suite already runs check-changelog.mjs; this is the same --check,
      # just visible. Regenerating here would write the runner, not the PR.
      - name: changelog.html + feed.xml match updates.json
        run: node scripts/gen-changelog.mjs --check

      # The pre-commit guard can only diff the sections llms-full.txt takes from THIS
      # repo; the two library sections need the sibling READMEs. Here they are checked
      # out fresh, so this is the check that catches a library README moving on without
      # a regeneration. Reads the siblings from disk — no clone, no network.
      - name: llms-full.txt matches the library READMEs
        env:
          NANOODLE_JS: ${{ github.workspace }}/nanoodle-js-sibling
          NANOODLE_PY: ${{ github.workspace }}/nanoodle-py-sibling
        run: node scripts/gen-llms-full.mjs --check
