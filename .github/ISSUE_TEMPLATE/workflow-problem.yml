name: Workflow problem
description: Tell us about a failed run or a confusing step while using NanoGPT.
title: "[Workflow problem] "
body:
  - type: markdown
    attributes:
      value: |
        This becomes public when you submit it on GitHub. Do not include API keys, OAuth tokens, private inputs, or private media. A share link is optional; nothing is submitted automatically.
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
      description: Describe the task and the steps that led to the problem.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what did you expect?
      description: Include the error message or the confusing step, and the model name if relevant. Remove credentials from any pasted text.
    validations:
      required: true
  - type: textarea
    id: share_link
    attributes:
      label: Full share link, if safe to publish
      description: Optional. A minimal example helps; full links include the graph and may include prompts or samples. Check their contents before posting.
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Firefox on Windows, or Safari on iPhone
  - type: input
    id: cost
    attributes:
      label: Cost shown, if any
      description: Optional. Include the currency and say whether a charge or only an estimate was shown.
  - type: dropdown
    id: repeat_use
    attributes:
      label: Had this workflow worked before?
      description: Optional.
      options:
        - This was my first attempt
        - It worked before
        - I am not sure
