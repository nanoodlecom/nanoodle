<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DEPRECATED mini-editor — use index.html?product=1 — Product · 1 — learned next-action (usage)</title>
<style>
:root{--bg:#0b0d12;--panel:#12151d;--panel2:#171b25;--ink:#eef1f7;--dim:#aeb7c8;--line:#2a2e3c;--accent:#7c8cff;--cyan:#67e8f9;--gold:#f5d76e;--mint:#6ee7b7}
*{box-sizing:border-box;margin:0;padding:0}
body{margin:0;font:13px/1.4 system-ui,-apple-system,sans-serif;background:#080a0e;color:var(--ink);overflow:hidden}
.shell{width:880px;height:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative}
header{display:flex;align-items:center;gap:.75rem;padding:.55rem .9rem;background:rgba(18,21,29,.95);border-bottom:1px solid var(--line);flex-shrink:0}
.logo{font-weight:800;font-size:1rem;background:linear-gradient(90deg,#67e8f9,#7c8cff 70%);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:.92rem;font-weight:600;flex:1}
.badge{font-size:.68rem;padding:.2rem .5rem;border-radius:999px;background:#1a2840;color:var(--cyan);border:1px solid #2a4060}
.sub{color:var(--dim);font-size:.72rem}
.workspace{flex:1;display:grid;grid-template-columns:118px 1fr 200px;min-height:0}
.pal{background:var(--panel);border-right:1px solid var(--line);padding:.65rem .5rem;display:flex;flex-direction:column;gap:.35rem}
.pal label,.tips label{font-size:.65rem;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.25rem}
.pal button{display:block;width:100%;text-align:left;padding:.45rem .55rem;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--dim);cursor:default;font:inherit;transition:all .25s}
.pal button.hot{color:var(--ink);border-color:var(--accent);background:#1e2640}
.canvas-wrap{position:relative;background:var(--panel);background-image:linear-gradient(rgba(22,26,36,.85) 1px,transparent 1px),linear-gradient(90deg,rgba(22,26,36,.85) 1px,transparent 1px);background-size:36px 36px;overflow:hidden}
.node{position:absolute;display:flex;align-items:center;gap:.45rem;padding:.5rem .75rem;background:var(--panel2);border:2px solid var(--gold);border-radius:10px;box-shadow:0 4px 16px #0006;opacity:0;transform:scale(.9);transition:opacity .35s,transform .35s,border-color .3s,box-shadow .3s;z-index:2}
.node.show{opacity:1;transform:scale(1)}
.node.sel{box-shadow:0 0 0 3px #f5d76e44,0 4px 16px #0006}
.node.llm{border-color:var(--accent)}
.node .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.wire{position:absolute;height:2px;background:linear-gradient(90deg,var(--gold),var(--accent));opacity:0;transition:opacity .4s,width .45s;transform-origin:left center;z-index:1;border-radius:2px}
.wire.show{opacity:.9}
.tips{background:var(--panel);border-left:1px solid var(--line);padding:.65rem .55rem;display:flex;flex-direction:column;gap:.4rem}
.tip{display:flex;align-items:center;gap:.45rem;padding:.45rem .55rem;border-radius:8px;border:1px dashed #3a4560;background:#141a28;color:var(--dim);opacity:0;transform:translateX(8px);transition:all .35s;font-size:.78rem}
.tip.show{opacity:1;transform:none}
.tip.best{border-style:solid;border-color:var(--cyan);color:var(--cyan);background:#152030;box-shadow:0 0 14px #67e8f933}
.tip .pct{margin-left:auto;font-size:.68rem;color:var(--gold)}
.tip.clicking{background:#1e3a50;transform:scale(.97)}
.hist{margin-top:auto;padding-top:.5rem;border-top:1px solid var(--line);font-size:.7rem;color:var(--dim)}
.hist b{color:var(--mint)}
.cursor{position:absolute;width:14px;height:14px;border-radius:50% 50% 50% 0;background:var(--ink);transform:rotate(-30deg);pointer-events:none;z-index:50;opacity:0;transition:left .55s cubic-bezier(.2,.8,.2,1),top .55s cubic-bezier(.2,.8,.2,1),opacity .2s;box-shadow:0 2px 6px #0008}
.cursor.on{opacity:1}
.cursor.click{transform:rotate(-30deg) scale(.85);background:var(--cyan)}
.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%) translateY(8px);background:#1a2840;border:1px solid var(--accent);color:var(--cyan);padding:.35rem .7rem;border-radius:8px;font-size:.72rem;opacity:0;transition:all .3s;z-index:10;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="shell" id="shell">
  <header>
    <div class="logo">nanoodle</div>
    <h1>Product · 1 — learned next-action</h1>
    <span class="badge">usage</span>
    <span class="sub">select → tip → place</span>
  </header>
  <div class="workspace">
    <aside class="pal">
      <label>palette</label>
      <button data-p="text">text</button>
      <button data-p="llm">llm</button>
      <button data-p="image">image</button>
      <button data-p="edit">edit</button>
    </aside>
    <div class="canvas-wrap" id="cv">
      <div class="node" id="nText" style="left:70px;top:150px"><span class="dot" style="background:var(--gold)"></span>text</div>
      <div class="wire" id="wire" style="left:168px;top:172px;width:0"></div>
      <div class="node llm" id="nLlm" style="left:280px;top:150px"><span class="dot" style="background:var(--accent)"></span>llm</div>
      <div class="toast" id="toast">placed via learned tip</div>
      <div class="cursor" id="cur"></div>
    </div>
    <aside class="tips">
      <label>soft tips · learned</label>
      <div class="tip" id="t0"><span>✦ add:llm</span><span class="pct">61%</span></div>
      <div class="tip" id="t1"><span>wire</span><span class="pct">22%</span></div>
      <div class="tip" id="t2"><span>set:model</span><span class="pct">11%</span></div>
      <div class="hist">history<br/><b id="hist">[ ]</b></div>
    </aside>
  </div>
</div>
<script>
const cur=document.getElementById('cur');
const nText=document.getElementById('nText');
const nLlm=document.getElementById('nLlm');
const wire=document.getElementById('wire');
const toast=document.getElementById('toast');
const tipEls=[document.getElementById('t0'),document.getElementById('t1'),document.getElementById('t2')];
const pal=[...document.querySelectorAll('.pal button')];
function move(x,y){cur.style.left=x+'px';cur.style.top=y+'px'}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
async function clickPulse(){cur.classList.add('click');await wait(120);cur.classList.remove('click')}
async function placeOnce(fast){
  const d=fast?0.7:1;
  move(55,95);await wait(450*d);await clickPulse();
  pal[0].classList.add('hot');
  document.getElementById('hist').textContent='[add:text]';
  nText.classList.add('show');await wait(300*d);
  move(130,175);await wait(400*d);await clickPulse();
  nText.classList.add('sel');await wait(200*d);
  tipEls.forEach((t,i)=>setTimeout(()=>{t.classList.add('show');if(i===0)t.classList.add('best')},i*160*d));
  await wait(650*d);
  move(780,95);await wait(450*d);await clickPulse();
  tipEls[0].classList.add('clicking');await wait(160);tipEls[0].classList.remove('clicking');
  nLlm.classList.add('show');wire.classList.add('show');wire.style.width='110px';
  document.getElementById('hist').textContent='[add:text, add:llm]';
  toast.classList.add('show');pal[1].classList.add('hot');
  await wait(1300*d);
}
async function cycle(){
  cur.classList.remove('on');nText.classList.remove('show','sel');nLlm.classList.remove('show');
  wire.classList.remove('show');wire.style.width='0';toast.classList.remove('show');
  tipEls.forEach(t=>t.classList.remove('show','best','clicking'));pal.forEach(b=>b.classList.remove('hot'));
  document.getElementById('hist').textContent='[ ]';
  await wait(180);cur.classList.add('on');
  await placeOnce(false);
  // reset soft for second pass
  nLlm.classList.remove('show');wire.classList.remove('show');wire.style.width='0';
  tipEls.forEach(t=>t.classList.remove('show','best','clicking'));
  nText.classList.remove('sel');toast.classList.remove('show');
  document.getElementById('hist').textContent='[add:text]';
  await wait(280);
  await placeOnce(true);
  await wait(500);
  cycle();
}
cycle();
</script>
</body>
</html>
